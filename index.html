<!doctype html>
<html lang="es">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#0B2265"
  >

  <title>
    Gold Services | Sistema Operativo
  </title>

  <link rel="stylesheet" href="styles.css">

</head>


<body>


<!-- ========================= -->
<!-- LOGIN -->
<!-- ========================= -->

<div id="goldLogin">

  <div class="gold-login-card">

    <h1>GOLD SERVICES</h1>

    <p>
      Sistema Operativo Digital<br>
      Gold Services and Consulting SpA
    </p>


    <form id="goldLoginForm">

      <label>
        Correo electrónico
      </label>

      <input
        id="goldEmail"
        type="email"
        required
      >


      <label>
        Contraseña
      </label>

      <input
        id="goldPassword"
        type="password"
        required
      >


      <button type="submit">
        INGRESAR
      </button>


      <div id="goldLoginError"></div>

    </form>

  </div>

</div>



<!-- ========================= -->
<!-- SISTEMA ORIGINAL -->
<!-- ========================= -->

<div
  class="app-shell"
  id="goldApp"
>

  <aside class="sidebar">


    <div class="brand">

      <div>

        <strong>
          GOLD SERVICES
        </strong>

        <small>
          AND CONSULTING SpA
        </small>

      </div>

    </div>


    <nav id="nav">


      <button
        class="nav-item active"
        data-view="dashboard"
      >

        ▦

        <span>
          Dashboard
        </span>

      </button>


      <button
        class="nav-item"
        data-view="clientes"
      >

        ◉

        <span>
          Clientes
        </span>

      </button>


      <button
        class="nav-item"
        data-view="servicios"
      >

        ◆

        <span>
          Servicios
        </span>

      </button>


      <button
        class="nav-item"
        data-view="proyectos"
      >

        ◇

        <span>
          Operaciones
        </span>

      </button>


      <button
        class="nav-item"
        data-view="trazabilidad"
      >

        ⌁

        <span>
          Gold Trace
        </span>

      </button>


      <button
        class="nav-item"
        data-view="certificaciones"
      >

        ✓

        <span>
          Certificaciones
        </span>

      </button>


      <button
        class="nav-item"
        data-view="mercados"
      >

        ◎

        <span>
          Mercados
        </span>

      </button>


    </nav>


    <div class="sidebar-footer">

      V1.0 · Agosto 2026<br>

      Arándanos + Avellanas

    </div>


  </aside>



  <main class="main">


    <header class="topbar">


      <div>

        <span class="eyebrow">
          SISTEMA OPERATIVO DIGITAL
        </span>

        <h1 id="pageTitle">
          Dashboard
        </h1>

      </div>


      <div class="top-actions">

        <button
          class="btn ghost"
          id="exportBtn"
        >
          Exportar datos
        </button>


        <button
          class="btn primary"
          id="quickAdd"
        >
          + Nuevo registro
        </button>


        <button
          class="btn ghost"
          onclick="cerrarSesion()"
        >
          Cerrar sesión
        </button>

      </div>


    </header>


    <section id="content"></section>


  </main>


</div>



<!-- MODAL -->

<div
  id="modal"
  class="modal hidden"
>

  <div class="modal-card">

    <div class="modal-head">

      <h2 id="modalTitle">
        Nuevo registro
      </h2>

      <button id="closeModal">
        ×
      </button>

    </div>


    <div id="modalBody"></div>

  </div>

</div>



<!-- MENSAJES -->

<div
  id="toast"
  class="toast hidden"
></div>



<!-- ========================= -->
<!-- SUPABASE -->
<!-- ========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- QR -->

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>


<!-- AUTENTICACIÓN -->

<script src="auth.js"></script>


<!-- SISTEMA ORIGINAL -->

<script src="app.js"></script>


</body>

</html>
