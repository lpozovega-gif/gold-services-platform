<form id="goldLoginForm" autocomplete="on">

  <label for="goldEmail">
    Correo electrónico
  </label>

  <input
    id="goldEmail"
    name="email"
    type="email"
    autocomplete="username"
    placeholder="Correo electrónico"
    required
  >

  <label for="goldPassword">
    Contraseña
  </label>

  <input
    id="goldPassword"
    name="password"
    type="password"
    autocomplete="current-password"
    placeholder="Contraseña"
    required
  >

  <button type="submit">
    INGRESAR
  </button>

  <div id="goldLoginError" role="alert"></div>

</form>
