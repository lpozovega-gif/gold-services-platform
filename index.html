<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Gold Services and Consulting SpA - Plataforma digital de servicios, calidad, trazabilidad y sourcing."
  >

  <title>Gold Services | Sistema Operativo Digital</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main id="app">

    <!-- ============================= -->
    <!-- LOGIN -->
    <!-- ============================= -->

    <section id="loginView">

      <div class="login-container">

        <h1>Gold Services</h1>

        <p>
          Sistema Operativo Digital
        </p>

        <form
          id="goldLoginForm"
          method="post"
          autocomplete="on"
        >

          <label for="goldEmail">
            Correo electrónico
          </label>

          <input
            id="goldEmail"
            name="email"
            type="email"
            autocomplete="username"
            placeholder="Correo electrónico"
            required
          >

          <label for="goldPassword">
            Contraseña
          </label>

          <input
            id="goldPassword"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Contraseña"
            required
          >

          <button
            type="submit"
            id="loginButton"
          >
            INGRESAR
          </button>

          <div
            id="goldLoginError"
            role="alert"
            aria-live="polite"
          ></div>

        </form>

      </div>

    </section>


    <!-- ============================= -->
    <!-- DASHBOARD -->
    <!-- ============================= -->

    <section
      id="dashboardView"
      hidden
    >

      <header>

        <h1>Gold Services</h1>

        <button
          type="button"
          id="logoutButton"
        >
          CERRAR SESIÓN
        </button>

      </header>

      <div id="dashboardContent">

        <h2>Dashboard operacional</h2>

        <p>
          Bienvenido a Gold Services.
        </p>

      </div>

    </section>

  </main>


  <!-- ============================= -->
  <!-- JAVASCRIPT -->
  <!-- ============================= -->

  <script src="auth.js"></script>
  <script src="app.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const loginForm =
        document.getElementById("goldLoginForm");

      const logoutButton =
        document.getElementById("logoutButton");

      /*
       * IMPORTANTE:
       * Evita que el navegador envíe el formulario
       * mediante GET y coloque email/password en la URL.
       */

      if (loginForm) {

        loginForm.addEventListener("submit", function (event) {

          event.preventDefault();

          if (typeof iniciarSesion === "function") {

            iniciarSesion(event);

          } else {

            console.error(
              "GOLD SERVICES: La función iniciarSesion() no está disponible."
            );

          }

        });

      }


      /*
       * CIERRE DE SESIÓN
       */

      if (logoutButton) {

        logoutButton.addEventListener("click", function (event) {

          event.preventDefault();

          if (typeof window.cerrarSesion === "function") {

            window.cerrarSesion(event);

          } else {

            console.error(
              "GOLD SERVICES: cerrarSesion() no está disponible."
            );

          }

        });

      }

    });
  </script>

</body>

</html>
